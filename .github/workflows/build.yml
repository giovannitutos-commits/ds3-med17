              private val thpDtcMap = mapOf(
                  "P0087" to "Pressão da Linha de Combustível (Rail) Muito Baixa — Verificar Bomba de Alta (HPFP)",
                  "P0088" to "Pressão da Linha de Combustível (Rail) Muito Alta — Regulador da HPFP",
                  "P0299" to "Pressão de Turbo Abaixo do Esperado (Underboost) — Diverter Valve (DV+), Wastegate ou Vazamento",
