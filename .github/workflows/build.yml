              <path android:pathData="M80.7,47.3 A28,28 0 0,1 78,70" android:strokeColor="#FF3D57" android:strokeWidth="6.5" android:strokeLineCap="round" />
              <path android:pathData="M54,55.6 L65,36.5" android:strokeColor="#FFAB00" android:strokeWidth="5.5" android:strokeLineCap="round" />
