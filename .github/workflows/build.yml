              @Composable
              private fun TileBox(p: P) {
                  val sz = cockpitSize[p.k] ?: 0
                  val gauge = gaugeStyle(p.k)
                  fun moveBy(d: Int) {
                      val i = visibleCockpitKeys.indexOf(p.k)
                      val j = i + d
                      if (i >= 0 && j >= 0 && j < visibleCockpitKeys.size) {
                          visibleCockpitKeys.removeAt(i); visibleCockpitKeys.add(j, p.k); save()
                      }
                  }
                  Box(Modifier.fillMaxWidth()) {
                      if (gauge) Gauge(p, Modifier.fillMaxWidth(), sz) else Metric(p, sz)
                      if (editLayoutMode) {
                          Surface(
                              color = MaterialTheme.colorScheme.background.copy(alpha = 0.88f),
                              shape = RoundedCornerShape(12.dp),
                              modifier = Modifier.matchParentSize()
                          ) {
                              Column(
                                  Modifier.fillMaxSize().padding(4.dp),
                                  verticalArrangement = Arrangement.Center,
                                  horizontalAlignment = Alignment.CenterHorizontally
                              ) {
                                  Row(verticalAlignment = Alignment.CenterVertically) {
                                      IconButton(onClick = { moveBy(-1) }, modifier = Modifier.size(38.dp)) {
                                          Icon(Icons.Rounded.ChevronLeft, contentDescription = null, tint = MaterialTheme.colorScheme.primary)
                                      }
                                      IconButton(onClick = { visibleCockpitKeys.remove(p.k); save() }, modifier = Modifier.size(38.dp)) {
