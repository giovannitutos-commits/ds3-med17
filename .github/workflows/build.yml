          class P(
              val k: String, val n: String, val u: String, val c: String,
              val d: Int, val lo: Double, val hi: Double, val fast: Boolean = false,
              val custom: Boolean = false, val feedBoost: Boolean = false,
              val f: (IntArray) -> Double
          )

          data class CustomPidSpec(
              val key: String, val name: String, val unit: String, val cmd: String,
              val mode: Int, val mul: Double, val add: Double, val dec: Int,
              val lo: Double, val hi: Double, val fast: Boolean, val feedBoost: Boolean
          ) {
              fun toP(): P = P(key, name, unit, cmd, dec, lo, hi, fast, true, feedBoost) { b ->
                  val raw = when (mode) {
                      0 -> b.getOrElse(0) { 0 }.toDouble()
                      1 -> if (b.size >= 2) (b[0] * 256 + b[1]).toDouble() else b.getOrElse(0) { 0 }.toDouble()
                      2 -> if (b.size >= 4) (b[2] * 256 + b[3]).toDouble() else if (b.size >= 2) (b[0] * 256 + b[1]).toDouble() else 0.0
                      3 -> {
                          val v = if (b.size >= 2) (b[0] * 256 + b[1]) else b.getOrElse(0) { 0 }
                          (if (v >= 32768) v - 65536 else v).toDouble()
                      }
                      else -> 0.0
                  }
                  raw * mul + add
              }
          }

          data class Al(val on: Boolean, val above: Boolean, val v: Double)
          data class LogRow(
              val tMs: Long, val rpm: Long, val boost: Double, val rail: Double,
              val afr: Double, val adv: Double, val iat: Double, val ect: Double, val tps: Double
          )
          data class TermLine(val time: String, val tx: String, val rx: String, val decoded: String, val isErr: Boolean)
          data class AccentPalette(val name: String, val pri: Color, val sec: Color)

          private val ErrCol = Color(0xFFFF3D57)
          private val OkCol = Color(0xFF00E676)

          @OptIn(ExperimentalMaterial3Api::class)
          class MainActivity : ComponentActivity() {
              private val spp = UUID.fromString("00001101-0000-1000-8000-00805F9B34FB")
              private val boostP = P("boost", "Boost Relativo", "bar", "", 2, -0.8, 2.5, true) { 0.0 }
              private val afrP = P("afr", "Mistura AFR", ":1", "", 1, 10.0, 18.0, true) { 0.0 }

              private val palettes = listOf(
                  AccentPalette("Laranja Track", Color(0xFFFF6D00), Color(0xFFFFAB00)),
                  AccentPalette("Vermelho OEM", Color(0xFFFF1744), Color(0xFFFF8A80)),
                  AccentPalette("Ciano Racing", Color(0xFF00E5FF), Color(0xFFFFAB00)),
                  AccentPalette("Verde Corsa", Color(0xFF00E676), Color(0xFF69F0AE)),
                  AccentPalette("Azul Telemetry", Color(0xFF2979FF), Color(0xFF82B1FF)),
                  AccentPalette("Âmbar Clássico", Color(0xFFFFAB00), Color(0xFFFFD740))
              )

              private val basePids = listOf(
                  P("rpm", "Rotação", "rpm", "010C", 0, 0.0, 7000.0, true) { (it[0] * 256 + it[1]) / 4.0 },
                  P("map16", "MAP (16-bit UDS)", "kPa", "220170", 1, 20.0, 350.0, true) {
                      if (it.size >= 4) ((it[2] * 256 + it[3]) * 0.03125)
                      else ((it[0] * 256 + it[1]) * 0.03125)
                  },
                  P("map_tgt", "Alvo MAP (Target)", "kPa", "22D408", 1, 100.0, 320.0, true) {
                      (it[0] * 256 + it[1]) / 10.0
                  },
                  P("map", "Pressão MAP (8-bit)", "kPa", "010B", 0, 20.0, 255.0, true) { it[0].toDouble() },
                  P("rail", "Pressão Rail", "bar", "0123", 1, 0.0, 220.0, true) { ((it[0] * 256 + it[1]) * 10.0) / 100.0 },
                  P("lam", "Lambda", "λ", "0124", 2, 0.65, 1.35, true) { (it[0] * 256 + it[1]) * 2 / 65536.0 },
                  P("adv", "Avanço Ignição", "°", "010E", 1, -15.0, 45.0, true) { it[0] / 2.0 - 64.0 },
                  P("tps", "Borboleta TPS", "%", "0111", 1, 0.0, 100.0, true) { it[0] * 100 / 255.0 },
                  P("spd", "Velocidade", "km/h", "010D", 0, 0.0, 240.0, true) { it[0].toDouble() },
                  P("iat", "Temp. Admissão (IAT)", "°C", "010F", 0, 0.0, 80.0, false) { it[0] - 40.0 },
                  P("ect", "Temp. Água (ECT)", "°C", "0105", 0, 40.0, 120.0, false) { it[0] - 40.0 },
                  P("cat", "Temp. Escape (EGT)", "°C", "013C", 0, 200.0, 980.0, false) { (it[0] * 256 + it[1]) / 10.0 - 40.0 },
                  P("st", "STFT (Curto)", "%", "0106", 1, -25.0, 25.0, false) { (it[0] - 128) * 100 / 128.0 },
                  P("lt", "LTFT (Longo)", "%", "0107", 1, -25.0, 25.0, false) { (it[0] - 128) * 100 / 128.0 },
                  P("ld", "Carga Motor", "%", "0104", 1, 0.0, 100.0, false) { it[0] * 100 / 255.0 },
                  P("maf", "Fluxo MAF", "g/s", "0110", 1, 0.0, 260.0, false) { (it[0] * 256 + it[1]) / 100.0 },
                  P("vb", "Tensão ECU", "V", "0142", 2, 11.0, 15.5, false) { (it[0] * 256 + it[1]) / 1000.0 }
              )

              private val customSpecs = mutableStateListOf<CustomPidSpec>()
