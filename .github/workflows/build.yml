              @Composable
              private fun Gauge(p: P, modifier: Modifier, sz: Int = 0) {
                  val v = live[p.k]
                  val peak = mx[p.k]
                  val hit = tripped[p.k] == true
                  val frac = (((v ?: p.lo) - p.lo) / (p.hi - p.lo)).toFloat().coerceIn(0f, 1f)
                  val peakFrac = (((peak ?: p.lo) - p.lo) / (p.hi - p.lo)).toFloat().coerceIn(0f, 1f)
                  val anim by animateFloatAsState(frac, animationSpec = tween(140), label = "gauge")

                  val trackCol = MaterialTheme.colorScheme.surfaceVariant
                  val priCol = MaterialTheme.colorScheme.primary
                  val secCol = MaterialTheme.colorScheme.secondary

                  val col by animateColorAsState(
                      when { hit || frac > 0.88f -> ErrCol; frac > 0.72f -> secCol; else -> priCol }, label = "color"
                  )

                  Card(
                      onClick = { editing = p }, modifier = modifier, colors = cc(),
                      shape = RoundedCornerShape(14.dp), border = BorderStroke(1.dp, if (hit) ErrCol else MaterialTheme.colorScheme.outline)
                  ) {
                      Box(Modifier.fillMaxWidth().aspectRatio(if (sz == 1) 1.75f else 1f), contentAlignment = Alignment.Center) {
                          Canvas(Modifier.fillMaxSize().padding(14.dp)) {
                              val w = 12.dp.toPx()
                              val s = Size(size.minDimension - w, size.minDimension - w)
                              val tl = Offset((size.width - s.width) / 2f, (size.height - s.height) / 2f)
                              drawArc(trackCol, 135f, 270f, false, tl, s, style = Stroke(w, cap = StrokeCap.Round))
                              drawArc(
                                  Brush.sweepGradient(listOf(priCol, col, ErrCol)),
                                  135f, 270f * anim, false, tl, s, style = Stroke(w, cap = StrokeCap.Round)
                              )
                              if (peak != null && peakFrac > 0.05f) {
                                  drawArc(
                                      secCol, 135f + 270f * peakFrac - 2f, 4f, false, tl, s,
                                      style = Stroke(w + 4.dp.toPx(), cap = StrokeCap.Butt)
                                  )
                              }
                          }
                          Column(horizontalAlignment = Alignment.CenterHorizontally) {
                              Text(
                                  if (v == null) "–" else fmt(p, v),
                                  style = (if (sz == 2) MaterialTheme.typography.displayLarge else if (sz == 1) MaterialTheme.typography.displayMedium else MaterialTheme.typography.headlineLarge).copy(
                                      fontFamily = FontFamily.Monospace, fontWeight = FontWeight.Bold
                                  ),
                                  color = if (hit) ErrCol else MaterialTheme.colorScheme.onSurface
                              )
                              Text(
                                  "${p.u} • pk ${if (peak == null) "–" else fmt(p, peak)}",
                                  style = MaterialTheme.typography.labelSmall.copy(fontFamily = FontFamily.Monospace),
                                  color = MaterialTheme.colorScheme.onSurfaceVariant
                              )
                          }
                          Text(
                              p.n.uppercase(),
                              Modifier.align(Alignment.BottomCenter).padding(bottom = 8.dp),
                              style = MaterialTheme.typography.labelSmall.copy(fontFamily = FontFamily.Monospace),
                              color = MaterialTheme.colorScheme.onSurfaceVariant,
                              fontWeight = FontWeight.Bold
                          )
                      }
                  }
              }

              @Composable
              private fun Metric(p: P, sz: Int = 0) {
                  val v = live[p.k]
                  val hit = tripped[p.k] == true
                  val dimmed = fastPoll && !p.fast
                  Card(
                      onClick = { editing = p },
                      colors = cc(if (hit) Color(0xFF381117) else if (dimmed) MaterialTheme.colorScheme.background else MaterialTheme.colorScheme.surface),
                      shape = RoundedCornerShape(10.dp),
                      border = BorderStroke(1.dp, if (hit) ErrCol else if (p.custom) MaterialTheme.colorScheme.primary.copy(alpha = 0.45f) else MaterialTheme.colorScheme.outline)
                  ) {
                      Column(Modifier.padding(11.dp), verticalArrangement = Arrangement.spacedBy(4.dp)) {
                          Row(verticalAlignment = Alignment.CenterVertically, horizontalArrangement = Arrangement.spacedBy(4.dp)) {
                              Text(
                                  p.n.uppercase(),
                                  style = MaterialTheme.typography.labelSmall.copy(fontFamily = FontFamily.Monospace),
                                  color = if (dimmed) MaterialTheme.colorScheme.onSurfaceVariant.copy(alpha = 0.5f) else MaterialTheme.colorScheme.onSurfaceVariant,
                                  modifier = Modifier.weight(1f), maxLines = 1, overflow = TextOverflow.Ellipsis,
                                  fontWeight = FontWeight.Bold
                              )
                              if (p.custom) {
                                  Surface(color = MaterialTheme.colorScheme.primary.copy(alpha = 0.15f), shape = RoundedCornerShape(3.dp)) {
                                      Text("UDS", Modifier.padding(horizontal = 4.dp, vertical = 1.dp), style = MaterialTheme.typography.labelSmall.copy(fontSize = 9.sp), color = MaterialTheme.colorScheme.primary)
                                  }
                              }
                              if (alerts[p.k]?.on == true) {
                                  Icon(Icons.Rounded.NotificationsActive, contentDescription = null, tint = MaterialTheme.colorScheme.secondary, modifier = Modifier.size(13.dp))
                              }
                          }
                          Row(verticalAlignment = Alignment.Bottom) {
                              Text(
                                  if (v == null) "–" else fmt(p, v),
                                  style = (if (sz == 0) MaterialTheme.typography.headlineSmall else if (sz == 1) MaterialTheme.typography.headlineMedium else MaterialTheme.typography.displayMedium).copy(
                                      fontFamily = FontFamily.Monospace, fontWeight = FontWeight.Bold
                                  ),
                                  color = if (hit) ErrCol else if (dimmed) MaterialTheme.colorScheme.onSurfaceVariant else MaterialTheme.colorScheme.onSurface
                              )
                              Spacer(Modifier.width(5.dp))
                              Text(p.u, style = MaterialTheme.typography.labelSmall, color = MaterialTheme.colorScheme.onSurfaceVariant, modifier = Modifier.padding(bottom = 3.dp))
                          }
                          LinearProgressIndicator(
                              progress = { (((v ?: p.lo) - p.lo) / (p.hi - p.lo)).toFloat().coerceIn(0f, 1f) },
                              modifier = Modifier.fillMaxWidth().height(3.dp).clip(RoundedCornerShape(2.dp)),
                              color = if (hit) ErrCol else MaterialTheme.colorScheme.primary, trackColor = MaterialTheme.colorScheme.surfaceVariant
                          )
                          val a = mn[p.k]; val z = mx[p.k]
                          Text(
                              if (a == null || z == null) "min –  max –" else "min ${fmt(p, a)}  max ${fmt(p, z)}",
                              style = MaterialTheme.typography.labelSmall.copy(fontFamily = FontFamily.Monospace, fontSize = 10.sp),
                              color = MaterialTheme.colorScheme.onSurfaceVariant
                          )
                      }
                  }
              }

