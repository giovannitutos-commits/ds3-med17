              private val visibleCockpitKeys = mutableStateListOf<String>()
              private var editLayoutMode by mutableStateOf(false)
              private val cockpitSize = mutableStateMapOf<String, Int>()
              private val cockpitGauge = mutableStateMapOf<String, Boolean>()
              private fun gaugeStyle(k: String) = cockpitGauge[k] ?: (k == "rpm" || k == "boost")

