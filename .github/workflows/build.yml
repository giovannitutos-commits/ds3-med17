              @Composable
              private fun EcuAndAboutScreen() {
                  var confirmClear by remember { mutableStateOf(false) }
                  val ok = state == 2 && sock != null
                  val dtcList = dtcs

                  Column(
                      Modifier.fillMaxSize().verticalScroll(rememberScrollState()).padding(16.dp),
                      verticalArrangement = Arrangement.spacedBy(12.dp)
                  ) {
                      Card(colors = cc(), shape = RoundedCornerShape(12.dp), border = BorderStroke(1.dp, MaterialTheme.colorScheme.outline), modifier = Modifier.fillMaxWidth()) {
                          Column(Modifier.padding(16.dp), verticalArrangement = Arrangement.spacedBy(10.dp)) {
                              Row(verticalAlignment = Alignment.CenterVertically, horizontalArrangement = Arrangement.spacedBy(8.dp)) {
                                  Icon(Icons.Rounded.Palette, contentDescription = null, tint = MaterialTheme.colorScheme.primary)
                                  Text("Aparência & Tema", style = MaterialTheme.typography.titleMedium, fontWeight = FontWeight.Bold)
                              }
                              Text("Modo de Exibição (Claro / Escuro)", style = MaterialTheme.typography.labelMedium, color = MaterialTheme.colorScheme.onSurfaceVariant)
                              Row(
                                  Modifier.fillMaxWidth().horizontalScroll(rememberScrollState()),
                                  horizontalArrangement = Arrangement.spacedBy(6.dp)
                              ) {
                                  listOf("Automático (Sistema)", "Escuro", "Claro").forEachIndexed { idx, label ->
                                      FilterChip(
                                          selected = darkThemeOpt == idx,
                                          onClick = { darkThemeOpt = idx; save() },
                                          label = { Text(label, style = MaterialTheme.typography.labelSmall) }
                                      )
                                  }
                              }
                              Text("Paleta de Cores do Painel", style = MaterialTheme.typography.labelMedium, color = MaterialTheme.colorScheme.onSurfaceVariant)
                              Row(
                                  Modifier.fillMaxWidth().horizontalScroll(rememberScrollState()),
                                  horizontalArrangement = Arrangement.spacedBy(8.dp)
                              ) {
                                  palettes.forEachIndexed { idx, pal ->
                                      FilterChip(
                                          selected = accentColorIdx == idx,
                                          onClick = { accentColorIdx = idx; save() },
                                          leadingIcon = {
                                              Box(Modifier.size(12.dp).clip(CircleShape).background(pal.pri))
                                          },
                                          label = { Text(pal.name, style = MaterialTheme.typography.labelSmall) }
                                      )
                                  }
                              }
                          }
                      }

                      Card(colors = cc(), shape = RoundedCornerShape(12.dp), border = BorderStroke(1.dp, MaterialTheme.colorScheme.outline), modifier = Modifier.fillMaxWidth()) {
                          Column(Modifier.padding(16.dp), verticalArrangement = Arrangement.spacedBy(10.dp)) {
                              Text("Diagnóstico Bosch MED17.4.2", style = MaterialTheme.typography.titleMedium, fontWeight = FontWeight.Bold)
                              Row(horizontalArrangement = Arrangement.spacedBy(8.dp)) {
                                  Button(enabled = ok, shape = RoundedCornerShape(8.dp), onClick = { readDtc() }) {
                                      Icon(Icons.Rounded.Search, contentDescription = null)
                                      Spacer(Modifier.width(6.dp))
                                      Text("Ler DTCs")
                                  }
                                  OutlinedButton(enabled = ok, shape = RoundedCornerShape(8.dp), onClick = { confirmClear = true }) {
                                      Icon(Icons.Rounded.DeleteSweep, contentDescription = null)
                                      Spacer(Modifier.width(6.dp))
                                      Text("Apagar Memória")
                                  }
                              }
                          }
                      }

                      DtcSection(ok = ok, dtcList = dtcList, thpMap = thpDtcMap)

                      Card(colors = cc(), shape = RoundedCornerShape(12.dp), border = BorderStroke(1.dp, MaterialTheme.colorScheme.outline), modifier = Modifier.fillMaxWidth()) {
                          Column(Modifier.padding(16.dp), verticalArrangement = Arrangement.spacedBy(8.dp)) {
                              Row(verticalAlignment = Alignment.CenterVertically, horizontalArrangement = Arrangement.spacedBy(8.dp)) {
                                  Icon(Icons.Rounded.Verified, contentDescription = null, tint = MaterialTheme.colorScheme.primary)
                                  Text("Sobre o Aplicativo", style = MaterialTheme.typography.titleMedium, fontWeight = FontWeight.Bold)
                              }
                              HorizontalDivider(color = MaterialTheme.colorScheme.outline)
                              Row(Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.SpaceBetween) {
                                  Text("Autor / Criador", style = MaterialTheme.typography.bodyMedium, color = MaterialTheme.colorScheme.onSurfaceVariant)
                                  Text("Giovanni Stocco", style = MaterialTheme.typography.bodyMedium, fontWeight = FontWeight.Bold, color = MaterialTheme.colorScheme.primary)
                              }
                              Row(Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.SpaceBetween) {
                                  Text("Versão", style = MaterialTheme.typography.bodyMedium, color = MaterialTheme.colorScheme.onSurfaceVariant)
                                  Text("9.0 (Release)", style = MaterialTheme.typography.bodyMedium.copy(fontFamily = FontFamily.Monospace), fontWeight = FontWeight.SemiBold)
                              }
                              Row(Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.SpaceBetween) {
                                  Text("Arquitetura ECU", style = MaterialTheme.typography.bodyMedium, color = MaterialTheme.colorScheme.onSurfaceVariant)
                                  Text("Bosch MED17.4.2 CAN/UDS", style = MaterialTheme.typography.bodyMedium.copy(fontFamily = FontFamily.Monospace))
                              }
                              Text(
                                  "Desenvolvido sob medida por Giovanni Stocco para monitoramento em tempo real, diagnóstico avançado UDS (Serviço 0x22), datalogger CSV e medição de performance via GPS.",
                                  style = MaterialTheme.typography.bodySmall,
                                  color = MaterialTheme.colorScheme.onSurfaceVariant
                              )
                          }
                      }
                  }

                  if (confirmClear) {
                      AlertDialog(
                          containerColor = MaterialTheme.colorScheme.surfaceVariant,
                          onDismissRequest = { confirmClear = false },
                          title = { Text("Limpar Avarias (Modo 04)?") },
                          text = { Text("Isso apagará a luz de injeção (MIL) e os parâmetros de Freeze Frame da MED17.4.2.") },
                          confirmButton = {
                              Button(
                                  colors = ButtonDefaults.buttonColors(containerColor = ErrCol),
                                  onClick = { confirmClear = false; clearDtc() }
                              ) { Text("Apagar Tudo") }
                          },
                          dismissButton = { TextButton(onClick = { confirmClear = false }) { Text("Cancelar") } }
                      )
                  }
              }

              @Composable
              private fun DtcSection(ok: Boolean, dtcList: List<String>?, thpMap: Map<String, String>) {
                  if (dtcList == null) {
                      Text(
                          if (ok) "Toque em Ler DTCs para consultar a ECU."
                          else "Conecte ao adaptador OBD2 com a ignição ligada para ler códigos de falha.",
                          color = MaterialTheme.colorScheme.onSurfaceVariant, modifier = Modifier.padding(4.dp),
                          style = MaterialTheme.typography.bodySmall
                      )
                  } else if (dtcList.isEmpty()) {
                      Card(colors = cc(MaterialTheme.colorScheme.surfaceVariant), shape = RoundedCornerShape(10.dp), border = BorderStroke(1.dp, OkCol.copy(alpha = 0.5f)), modifier = Modifier.fillMaxWidth()) {
                          Row(Modifier.padding(14.dp), verticalAlignment = Alignment.CenterVertically) {
                              Icon(Icons.Rounded.CheckCircle, contentDescription = null, tint = OkCol)
                              Spacer(Modifier.width(10.dp))
                              Text("Nenhuma avaria registrada na MED17.4.2.", color = OkCol, fontWeight = FontWeight.SemiBold)
                          }
                      }
                  } else {
                      Column(verticalArrangement = Arrangement.spacedBy(8.dp)) {
                          for (code in dtcList) {
                              Card(colors = cc(Color(0xFF381117)), shape = RoundedCornerShape(10.dp), border = BorderStroke(1.dp, ErrCol), modifier = Modifier.fillMaxWidth()) {
                                  Column(Modifier.padding(14.dp), verticalArrangement = Arrangement.spacedBy(4.dp)) {
                                      Text(code, style = MaterialTheme.typography.titleMedium.copy(fontFamily = FontFamily.Monospace, fontWeight = FontWeight.Bold), color = ErrCol)
                                      Text(
                                          thpMap[code] ?: "Código de falha OBD2 genérico ou específico PSA.",
                                          style = MaterialTheme.typography.bodySmall, color = Color(0xFFFFDAD6)
                                      )
                                  }
                              }
                          }
                      }
                  }
              }

              override fun onDestroy() {
                  stopGps()
                  running = false; close()
                  super.onDestroy()
              }
          }
          EOF
