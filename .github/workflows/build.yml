                  RingtoneManager.getRingtone(this, Uri.parse(uri)).getTitle(this)
              } catch (e: Exception) { "Nenhum som escolhido" }

              private fun setState(s: Int, msg: String) {
                  state = s; status = msg
                  runOnUiThread {
                      if (s == 2) window.addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON)
                      else window.clearFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON)
                  }
              }

              private fun needPerm(then: () -> Unit) {
                  if (Build.VERSION.SDK_INT >= 31 && checkSelfPermission(Manifest.permission.BLUETOOTH_CONNECT) != PackageManager.PERMISSION_GRANTED) {
                      pending = then
                      requestPermissions(arrayOf(Manifest.permission.BLUETOOTH_CONNECT), 1)
                  } else then()
              }

              override fun onRequestPermissionsResult(rc: Int, p: Array<String>, r: IntArray) {
                  super.onRequestPermissionsResult(rc, p, r)
                  if (r.isNotEmpty() && r[0] == PackageManager.PERMISSION_GRANTED) pending?.invoke()
                  else setState(0, "Permissão Bluetooth negada.")
                  pending = null
              }

              private fun adapter() = (getSystemService(BLUETOOTH_SERVICE) as BluetoothManager).adapter

              private fun pick() {
                  val ad = adapter()
                  if (ad == null || !ad.isEnabled) { setState(0, "Ligue o Bluetooth do celular."); return }
                  val l = ad.bondedDevices.toList()
                  if (l.isEmpty()) { setState(0, "Pareie o scanner ELM327 no Android primeiro."); return }
                  devs = l
              }

              private fun connectLast() {
                  val ad = adapter()
                  if (ad == null || !ad.isEnabled) { setState(0, "Ligue o Bluetooth do celular."); return }
                  val d = ad.bondedDevices.firstOrNull { it.address == lastAddr }
                  if (d != null) connect(d) else pick()
              }

              private fun connect(d: BluetoothDevice) {
                  setState(1, "Inicializando CAN/UDS 7E0 (MED17.4.2)…")
                  Thread {
                      try {
                          var s = d.createRfcommSocketToServiceRecord(spp)
                          try { s.connect() } catch (x: Exception) {
                              try { s.close() } catch (y: Exception) {}
                              s = d.createInsecureRfcommSocketToServiceRecord(spp)
                              s.connect()
                          }
                          sock = s; inp = s.inputStream; out = s.outputStream
                          for (c in listOf("ATZ", "ATE0", "ATL0", "ATS0", "ATH0", "ATSP6", "ATAT1", "ATSH7E0", "ATCRA7E8")) ask(c)
                          var r = ask("0100", 8000)
                          if (!r.replace(" ", "").contains("4100")) { ask("ATSP0"); r = ask("0100", 15000) }
                          if (!r.replace(" ", "").contains("4100")) throw Exception("ECU não respondeu. Verifique a ignição.")
                          bytes(ask("0133"), "0133")?.let { baro = it[0].toDouble() }
                          fails.clear(); live.clear(); mn.clear(); mx.clear(); tripped.clear()
                          lastAddr = d.address; sp.edit().putString("addr", d.address).apply()
                          running = true
                          setState(2, "Conectado • " + (d.name ?: d.address))
                          loop()
                      } catch (e: Exception) {
                          close()
                          setState(0, "Falha: " + e.message)
                      }
                  }.start()
              }

              private fun ask(c: String, wait: Long = 4000): String {
                  val i = inp!!
                  val o = out!!
                  while (i.available() > 0) i.read()
                  o.write((c + "\r").toByteArray()); o.flush()
                  val sb = StringBuilder()
                  val t = System.currentTimeMillis()
                  while (System.currentTimeMillis() - t < wait) {
                      if (i.available() > 0) {
                          val ch = i.read()
                          if (ch == 62) break
                          sb.append(ch.toChar())
                      } else Thread.sleep(5)
                  }
                  return sb.toString()
              }

              private fun bytes(r: String, cmd: String): IntArray? {
                  val cleanCmd = cmd.replace(" ", "").uppercase()
                  val expectedHeader = when {
                      cleanCmd.startsWith("01") -> "41" + cleanCmd.substring(2)
                      cleanCmd.startsWith("22") -> "62" + cleanCmd.substring(2)
                      else -> return null
                  }
                  for (l in r.split('\r', '\n')) {
                      val s = l.replace(" ", "").uppercase()
                      val cleanLine = s.replace(Regex("^[0-9A-F]:"), "")
                      val i = cleanLine.indexOf(expectedHeader)
                      if (i >= 0) {
                          val h = cleanLine.substring(i + expectedHeader.length)
                          return try {
                              IntArray(h.length / 2) { h.substring(it * 2, it * 2 + 2).toInt(16) }
                          } catch (x: Exception) { null }
                      }
                  }
                  return null
              }

              private fun sendRawTerminal(rawCmd: String) {
                  val cmd = rawCmd.trim().uppercase()
                  if (cmd.isEmpty() || termBusy) return
                  termBusy = true
                  val stamp = SimpleDateFormat("HH:mm:ss.SSS", Locale.US).format(Date())
                  Thread {
                      val rawResp = try {
                          if (sock != null && inp != null && out != null) {
                              synchronized(lock) { ask(cmd.replace(" ", ""), 5000) }
                          } else {
                              simulateUdsResponse(cmd.replace(" ", ""))
                          }
                      } catch (e: Exception) {
                          "ERR: ${e.message}"
                      }
                      val cleanRx = rawResp.replace('\r', ' ').replace('\n', ' ').trim().ifEmpty { "NO DATA" }
                      val (decoded, isErr) = decodeUdsFrame(cmd.replace(" ", ""), cleanRx)
                      runOnUiThread {
                          termLogs.add(0, TermLine(stamp, cmd, cleanRx, decoded, isErr))
                          if (termLogs.size > 80) termLogs.removeLast()
                          termBusy = false
                      }
                  }.start()
              }

              private fun simulateUdsResponse(cleanCmd: String): String {
                  Thread.sleep(60)
                  return when {
                      cleanCmd == "1003" -> "50 03 00 32 01 F4"
                      cleanCmd == "220170" -> "62 01 70 00 00 20 80"
                      cleanCmd == "22D408" -> "62 D4 08 09 60"
                      cleanCmd == "22D40A" -> "62 D4 0A 09 4C"
                      cleanCmd == "22F190" -> "62 F1 90 56 46 37 53 41 35 46 56"
                      cleanCmd.startsWith("AT") -> "OK"
                      cleanCmd.startsWith("23") -> "7F 23 33"
                      else -> "62 ${cleanCmd.drop(2).take(2)} ${cleanCmd.drop(4).take(2)} 04 B0"
                  }
              }

              private fun decodeUdsFrame(cleanCmd: String, rx: String): Pair<String, Boolean> {
                  val hexOnly = rx.replace(" ", "").uppercase()
                  if (hexOnly.contains("NODATA") || hexOnly.contains("ERR") || hexOnly.contains("?")) {
                      return "Sem resposta da ECU ou sintaxe inválida" to true
                  }
                  val nrcIdx = hexOnly.indexOf("7F")
                  if (nrcIdx >= 0 && hexOnly.length >= nrcIdx + 6) {
                      val srv = hexOnly.substring(nrcIdx + 2, nrcIdx + 4)
                      val nrc = hexOnly.substring(nrcIdx + 4, nrcIdx + 6)
                      val desc = udsNrcMap[nrc] ?: "Código NRC desconhecido"
                      return "Negado (Srv $srv, NRC 0x$nrc): $desc" to true
                  }
                  if (hexOnly.startsWith("5003")) {
                      return "Sessão Diagnóstica Estendida MED17 Ativada (0x50 0x03)" to false
                  }
                  if (cleanCmd.startsWith("22") && hexOnly.contains("62" + cleanCmd.substring(2))) {
                      val hdr = "62" + cleanCmd.substring(2)
                      val payload = hexOnly.substringAfter(hdr)
                      val b = try {
                          IntArray(payload.length / 2) { payload.substring(it * 2, it * 2 + 2).toInt(16) }
                      } catch (e: Exception) { IntArray(0) }
                      if (b.isEmpty()) return "Resposta positiva sem payload" to false
                      val u8 = b[0]
                      val u16 = if (b.size >= 2) (b[0] * 256 + b[1]) else b[0]
                      val u16Last = if (b.size >= 4) (b[b.size - 2] * 256 + b[b.size - 1]) else u16
                      return "Bytes: ${b.joinToString(" ") { "%02X".format(it) }} | 8b(A)=$u8 | 16b(AB)=$u16 | 16b(CD)=$u16Last" to false
                  }
                  return "Resposta bruta recebida" to false
              }

              private fun loop() {
                  var reads = 0
                  var tWindow = SystemClock.elapsedRealtime()
                  while (running) {
                      val currentList = activePids()
                      val activeList = if (fastPoll) currentList.filter { it.fast } else currentList
                      for (p in activeList) {
                          if (!running) return
                          if ((fails[p.k] ?: 0) >= 3) continue
                          try {
                              val b = synchronized(lock) { bytes(ask(p.c), p.c) }
                              if (b == null) { fails[p.k] = (fails[p.k] ?: 0) + 1; continue }
                              val v = runCatching { p.f(b) }.getOrNull() ?: continue
                              onNewValue(p, v)
                              reads++
                              val now = SystemClock.elapsedRealtime()
                              if (now - tWindow >= 1000L) {
                                  hz = reads * 1000.0 / (now - tWindow)
                                  reads = 0
                                  tWindow = now
                              }
                          } catch (e: Exception) {
                              if (running) { running = false; close(); setState(0, "Conexão perdida com o ELM327") }
                              return
                          }
                      }
                      recordLogTick()
                  }
              }

              private fun onNewValue(p: P, v: Double) {
                  show(p, v)
                  val hasCustomBoost = customSpecs.any { it.feedBoost }
                  if (p.feedBoost) {
                      show(boostP, (v - baro) / 100.0)
                  } else if (!hasCustomBoost) {
                      if (p.k == "map16") {
                          show(boostP, (v - baro) / 100.0)
                      } else if (p.k == "map" && (fails["map16"] ?: 0) >= 3) {
                          show(boostP, (v - baro) / 100.0)
                      }
                  }
                  if (p.k == "lam") show(afrP, v * 14.7)
              }

              private fun hasLocPerm() =
                  checkSelfPermission(Manifest.permission.ACCESS_FINE_LOCATION) == PackageManager.PERMISSION_GRANTED

              private fun ensureGps() {
                  if (hasLocPerm()) startGps()
                  else locPermLauncher.launch(arrayOf(Manifest.permission.ACCESS_FINE_LOCATION, Manifest.permission.ACCESS_COARSE_LOCATION))
              }

              private fun startGps() {
                  if (gpsOn || !hasLocPerm()) return
                  if (!locMgr.isProviderEnabled(LocationManager.GPS_PROVIDER)) { gpsMsg = "Ative o GPS do celular"; return }
                  try {
                      locMgr.requestLocationUpdates(LocationManager.GPS_PROVIDER, 0L, 0f, locListener, Looper.getMainLooper())
                      gpsOn = true; gpsMsg = ""; gpsPrevV = -1.0
                      gpsHandler.postDelayed(gpsTick, 1000)
                  } catch (e: Exception) { gpsMsg = "GPS indisponível: " + e.message }
              }

              private fun stopGps() {
                  if (!gpsOn) return
                  runCatching { locMgr.removeUpdates(locListener) }
                  gpsOn = false; gpsKmh = null; gpsFresh = false; gpsPrevV = -1.0
                  gpsHandler.removeCallbacks(gpsTick)
              }

              private fun onGpsFix(t: Long, v: Double) {
                  gpsKmh = v; gpsLastFix = SystemClock.elapsedRealtime(); gpsFresh = true
                  val pv = gpsPrevV
                  val pt = gpsPrevT
                  gpsPrevV = v; gpsPrevT = t
                  if (pv < 0.0 || t <= pt) return
                  fun cross(th: Double): Long? =
                      if (pv < th && v >= th) pt + ((th - pv) / (v - pv) * (t - pt)).toLong() else null
                  if (dragArmed && !dragRunning) {
                      val c = cross(1.0)
                      if (c != null) { dragRunning = true; dragStartT = c; drag40T = 0L }
                  }
                  if (dragRunning) {
                      cross(40.0)?.let { if (drag40T == 0L) drag40T = it }
                      cross(60.0)?.let { if (time0to60 == null) time0to60 = (it - dragStartT) / 1000.0 }
                      cross(100.0)?.let { if (time0to100 == null) time0to100 = (it - dragStartT) / 1000.0 }
                      cross(120.0)?.let {
                          if (drag40T > 0L && time40to120 == null) time40to120 = (it - drag40T) / 1000.0
                          dragArmed = false; dragRunning = false
                      }
                      if (time0to60 == null && t - dragStartT > 5000L && v < 8.0) {
                          dragRunning = false
                      } else if (t - dragStartT > 90_000L || (time0to100 != null && v < 5.0)) {
                          dragArmed = false; dragRunning = false
                      }
                  }
              }

              private fun recordLogTick() {
                  if (!isLogging) return
                  val now = SystemClock.elapsedRealtime()
                  if (logData.size < 15000) {
                      logData.add(
                          LogRow(
                              tMs = now - logStartMs,
                              rpm = (live["rpm"] ?: 0.0).toLong(),
                              boost = live["boost"] ?: 0.0,
                              rail = live["rail"] ?: 0.0,
                              afr = live["afr"] ?: 14.7,
                              adv = live["adv"] ?: 0.0,
                              iat = live["iat"] ?: 0.0,
                              ect = live["ect"] ?: 0.0,
                              tps = live["tps"] ?: 0.0
                          )
                      )
                  }
              }

              private fun show(p: P, v: Double) {
                  live[p.k] = v
                  mn[p.k] = minOf(mn[p.k] ?: v, v)
                  mx[p.k] = maxOf(mx[p.k] ?: v, v)
                  val a = alerts[p.k]
                  val hit = master && a != null && a.on && (if (a.above) v > a.v else v < a.v)
                  if (tripped[p.k] != hit) tripped[p.k] = hit
                  if (hit) {
                      val now = SystemClock.elapsedRealtime()
                      if (now - lastBeep > cool * 1000L) { lastBeep = now; runOnUiThread { beep() } }
                  }
              }

              private fun resetPeaks() {
                  mn.clear(); mx.clear(); tripped.clear(); fails.clear()
              }

              private fun resetCockpit() {
                  cockpitSize.clear(); cockpitGauge.clear()
                  visibleCockpitKeys.clear()
                  visibleCockpitKeys.addAll(listOf("rpm", "boost", "rail", "afr", "map16", "map_tgt", "adv", "tps", "spd", "iat", "ect", "cat", "st", "lt", "ld", "maf", "vb"))
                  visibleCockpitKeys.addAll(customSpecs.map { it.key })
                  save()
              }

              private fun demo() {
                  running = true
                  live.clear(); mn.clear(); mx.clear(); tripped.clear()
                  setState(2, "Simulação Stage 3 UDS Ativa")
                  Thread {
                      val t0 = System.currentTimeMillis()
                      while (running) {
                          val t = (System.currentTimeMillis() - t0) / 1000.0
                          val throttle = ((sin(t * 0.65) + 1.0) / 2.0).coerceIn(0.05, 1.0)
                          activePids().forEachIndexed { i, p ->
                              val v = when (p.k) {
                                  "rpm" -> 850.0 + throttle * 5650.0
                                  "map16" -> 35.0 + throttle * 255.0
                                  "map_tgt" -> 100.0 + throttle * 195.0
                                  "map" -> (35.0 + throttle * 255.0).coerceAtMost(255.0)
                                  "rail" -> 50.0 + throttle * 145.0
                                  "lam" -> 1.0 - (if (throttle > 0.65) 0.18 else 0.02 * sin(t * 2.0))
                                  "adv" -> 18.0 - throttle * 8.0 + 4.0 * sin(t)
                                  "tps" -> throttle * 100.0
                                  "spd" -> (throttle * 165.0).coerceAtLeast(0.0)
                                  "ect" -> 89.0 + 3.0 * sin(t / 6.0)
                                  "iat" -> 34.0 + throttle * 14.0
                                  "cat" -> 420.0 + throttle * 440.0
                                  "vb" -> 14.1 + 0.1 * cos(t)
                                  else -> p.lo + (p.hi - p.lo) * (0.3 + 0.25 * sin(t * (0.4 + i * 0.1)))
                              }
                              onNewValue(p, v)
                          }
                          hz = if (fastPoll) 18.5 else 9.2
                          recordLogTick()
                          Thread.sleep(if (fastPoll) 90 else 180)
                      }
                  }.start()
              }

              private fun readDtc() {
                  Thread {
                      val r = try { synchronized(lock) { ask("03") } } catch (e: Exception) { "" }
                      val s = r.split('\r', '\n').map { it.trim() }
                          .filter { it.isNotEmpty() && !Regex("[0-9A-Fa-f]{3}").matches(it) }
                          .joinToString("") { it.replace(Regex("^\\d:"), "").replace(" ", "") }.uppercase()
                      val i = s.indexOf("43")
                      dtcs = if (i < 0) emptyList() else s.substring(i + 4).chunked(4).filter { it.length == 4 && it != "0000" }.map {
                          val n = it.toInt(16)
                          "PCBU"[n shr 14].toString() + ((n shr 12) and 3) + it.substring(1)
                      }
                  }.start()
              }

              private fun clearDtc() {
                  Thread {
                      try { synchronized(lock) { ask("04") } } catch (e: Exception) {}
                      readDtc()
                  }.start()
              }

              private fun close() { try { sock?.close() } catch (x: Exception) {}; sock = null }
              private fun stop(msg: String) { running = false; isLogging = false; close(); setState(0, msg) }
              private fun fmt(p: P, v: Double) = "%.${p.d}f".format(Locale.US, v)

