              @Composable
              private fun ShiftLightBar() {
                  val rpm = live["rpm"] ?: 0.0
                  val startRpm = (shiftRpm - 1800).coerceAtLeast(3000)
                  val progress = ((rpm - startRpm) / (shiftRpm - startRpm)).toFloat().coerceIn(0f, 1f)
                  val segments = 16
                  val activeSegments = (progress * segments).toInt()
                  val overShift = rpm >= shiftRpm
                  val offCol = MaterialTheme.colorScheme.surfaceVariant
                  val midCol = MaterialTheme.colorScheme.secondary

                  Row(
                      Modifier.fillMaxWidth().padding(horizontal = 16.dp, vertical = 4.dp),
                      horizontalArrangement = Arrangement.spacedBy(3.dp)
                  ) {
                      for (i in 0 until segments) {
                          val segColor = when {
                              overShift -> ErrCol
                              i >= activeSegments -> offCol
                              i < segments * 0.5f -> OkCol
                              i < segments * 0.8f -> midCol
                              else -> ErrCol
                          }
                          Box(
                              Modifier.weight(1f).height(5.dp).clip(RoundedCornerShape(2.dp)).background(segColor)
                          )
                      }
                  }
              }

