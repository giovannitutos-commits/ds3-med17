                  "P1336" to "Falha de Ignição (Misfire) em Vários Cilindros",
                  "P1337" to "Falha de Ignição (Misfire) no Cilindro 1 — Bobina ou Vela",
                  "P1338" to "Falha de Ignição (Misfire) no Cilindro 2 — Bobina ou Vela",
                  "P1339" to "Falha de Ignição (Misfire) no Cilindro 3 — Bobina ou Vela",
                  "P1340" to "Falha de Ignição (Misfire) no Cilindro 4 — Bobina ou Vela",
                  "P0016" to "Sincronismo Virabrequim/Comando Incorreto — Verificar Esticador/Corrente",
                  "P0171" to "Mistura Muito Pobre (Banco 1) — Entrada Falsa de Ar ou Bomba",
                  "P0172" to "Mistura Muito Rica (Banco 1)",
                  "P0420" to "Eficiência do Catalisador Abaixo do Limite (Comum com Downpipe)"
              )

              private val udsNrcMap = mapOf(
                  "10" to "General Reject",
                  "11" to "Service Not Supported",
                  "12" to "Sub-Function Not Supported",
                  "13" to "Incorrect Message Length",
                  "22" to "Conditions Not Correct (Ligue a ignição/motor)",
                  "31" to "Request Out Of Range (DID/Endereço não existe nesta ROM)",
                  "33" to "Security Access Denied (Requer Seed/Key Modo 27)",
                  "7F" to "Service Not Supported In Active Session (Envie 10 03 primeiro)"
              )

              private val lock = Any()
              private val live = mutableStateMapOf<String, Double>()
              private val mn = mutableStateMapOf<String, Double>()
              private val mx = mutableStateMapOf<String, Double>()
              private val tripped = mutableStateMapOf<String, Boolean>()
              private val alerts = mutableStateMapOf<String, Al>()

              private var status by mutableStateOf("Pronto para conectar")
              private var state by mutableStateOf(0)
              private var fastPoll by mutableStateOf(false)
              private var shiftRpm by mutableStateOf(6200)
              private var editing by mutableStateOf<P?>(null)
              private var showAddPid by mutableStateOf(false)
              private var prefillCmd by mutableStateOf("22 D4 0A")
              private var devs by mutableStateOf<List<BluetoothDevice>?>(null)
              private var dtcs by mutableStateOf<List<String>?>(null)

              private var showTerm by mutableStateOf(false)
              private val termLogs = mutableStateListOf<TermLine>()
              private var termBusy by mutableStateOf(false)

              private var master by mutableStateOf(true)
              private var snd by mutableStateOf(1)
              private var uri by mutableStateOf<String?>(null)
              private var cool by mutableStateOf(8)
              private var vibe by mutableStateOf(true)
              private var hz by mutableStateOf(0.0)

              private var isLogging by mutableStateOf(false)
              private var logStartMs = 0L
              private val logData = mutableStateListOf<LogRow>()

              private var dragArmed by mutableStateOf(false)
              private var dragRunning by mutableStateOf(false)
              private var time0to60 by mutableStateOf<Double?>(null)
              private var time0to100 by mutableStateOf<Double?>(null)
              private var time40to120 by mutableStateOf<Double?>(null)

              private val locMgr by lazy { getSystemService(LOCATION_SERVICE) as LocationManager }
              private var gpsOn by mutableStateOf(false)
              private var gpsKmh by mutableStateOf<Double?>(null)
              private var gpsFresh by mutableStateOf(false)
              private var gpsMsg by mutableStateOf("")
              private var gpsLastFix = 0L
              private var gpsPrevV = -1.0
              private var gpsPrevT = 0L
              private var dragStartT = 0L
              private var drag40T = 0L
              private val gpsHandler = Handler(Looper.getMainLooper())
              private val gpsTick = object : Runnable {
                  override fun run() {
                      gpsFresh = SystemClock.elapsedRealtime() - gpsLastFix < 3000
                      if (gpsOn) gpsHandler.postDelayed(this, 1000)
                  }
              }
              private val locListener = object : LocationListener {
                  override fun onLocationChanged(l: Location) {
                      if (!l.hasSpeed()) return
                      onGpsFix(l.elapsedRealtimeNanos / 1_000_000L, l.speed * 3.6)
                  }
                  override fun onProviderEnabled(provider: String) {}
                  override fun onProviderDisabled(provider: String) { gpsMsg = "GPS desligado nas configurações" }
                  @Deprecated("Deprecated in Java")
                  override fun onStatusChanged(provider: String?, status: Int, extras: Bundle?) {}
              }
              private val locPermLauncher = registerForActivityResult(ActivityResultContracts.RequestMultiplePermissions()) { r ->
                  if (r.values.any { it }) startGps() else gpsMsg = "Permissão de localização negada"
              }

              private lateinit var sp: SharedPreferences
              private var lastAddr: String? = null
              private var lastBeep = 0L
              private var sock: BluetoothSocket? = null
              private var inp: InputStream? = null
              private var out: OutputStream? = null
              @Volatile private var running = false
              private var baro = 101.0
              private var pending: (() -> Unit)? = null
              private val fails = HashMap<String, Int>()
              private val tg by lazy { ToneGenerator(AudioManager.STREAM_ALARM, 100) }

              private val pickSound = registerForActivityResult(ActivityResultContracts.StartActivityForResult()) { r ->
                  if (r.resultCode == RESULT_OK) {
                      @Suppress("DEPRECATION")
                      val u = r.data?.getParcelableExtra<Uri>(RingtoneManager.EXTRA_RINGTONE_PICKED_URI)
                      if (u != null) { uri = u.toString(); snd = 4; save() }
                  }
              }

              private val exportCsvLauncher = registerForActivityResult(ActivityResultContracts.CreateDocument("text/csv")) { docUri ->
                  if (docUri != null) {
                      runCatching {
                          contentResolver.openOutputStream(docUri)?.use { os ->
                              val sb = StringBuilder()
                              sb.append("Time_s,RPM,Boost_bar,Rail_bar,AFR,Ign_Adv_deg,IAT_C,ECT_C,TPS_pct\n")
                              logData.forEach { r ->
                                  sb.append(
                                      String.format(
                                          Locale.US, "%.3f,%d,%.2f,%.1f,%.2f,%.1f,%.0f,%.0f,%.1f\n",
                                          r.tMs / 1000.0, r.rpm, r.boost, r.rail, r.afr, r.adv, r.iat, r.ect, r.tps
                                      )
                                  )
                              }
                              os.write(sb.toString().toByteArray())
                          }
                      }
                  }
              }

              private fun load() {
                  sp = getSharedPreferences("ds3", 0)
                  master = sp.getBoolean("master", true)
                  snd = sp.getInt("snd", 1)
                  uri = sp.getString("uri", null)
                  cool = sp.getInt("cool", 8)
                  vibe = sp.getBoolean("vibe", true)
                  shiftRpm = sp.getInt("shiftRpm", 6200)
                  lastAddr = sp.getString("addr", null)
                  darkThemeOpt = sp.getInt("dark_theme_opt", 0)
                  accentColorIdx = sp.getInt("accent_color_idx", 0).coerceIn(0, palettes.lastIndex)

                  slStart = sp.getInt("sl_start", 5200)
                  slMid = sp.getInt("sl_mid", 5800)
                  slMax = sp.getInt("sl_max", 6400)
                  slFlash = sp.getBoolean("sl_flash", true)

                  customSpecs.clear()
                  sp.getString("custom_pids", null)?.let { jsonStr ->
                      runCatching {
                          val arr = JSONArray(jsonStr)
                          for (i in 0 until arr.length()) {
                              val o = arr.getJSONObject(i)
                              customSpecs.add(
                                  CustomPidSpec(
                                      key = o.getString("key"),
                                      name = o.getString("name"),
                                      unit = o.getString("unit"),
                                      cmd = o.getString("cmd"),
                                      mode = o.optInt("mode", 1),
                                      mul = o.optDouble("mul", 1.0),
                                      add = o.optDouble("add", 0.0),
                                      dec = o.optInt("dec", 1),
                                      lo = o.optDouble("lo", 0.0),
                                      hi = o.optDouble("hi", 100.0),
                                      fast = o.optBoolean("fast", true),
                                      feedBoost = o.optBoolean("feedBoost", false)
                                  )
                              )
                          }
                      }
                  }

                  visibleCockpitKeys.clear()
                  val savedKeys = sp.getString("visible_cockpit_keys", null)
                  if (savedKeys != null) {
                      runCatching {
                          val arr = JSONArray(savedKeys)
                          for (i in 0 until arr.length()) visibleCockpitKeys.add(arr.getString(i))
                      }
                  }
                  if (visibleCockpitKeys.isEmpty()) {
                      visibleCockpitKeys.addAll(listOf("rpm", "boost", "rail", "afr", "map16", "map_tgt", "adv", "tps", "spd", "iat", "ect", "cat", "st", "lt", "ld", "maf", "vb"))
                      visibleCockpitKeys.addAll(customSpecs.map { it.key })
                  }

                  cockpitSize.clear(); cockpitGauge.clear()
                  sp.getString("cockpit_cfg", null)?.let { js ->
                      runCatching {
                          val o = JSONObject(js)
                          o.keys().forEach { k ->
                              val c = o.getJSONObject(k)
                              cockpitSize[k] = c.optInt("s", 0)
                              cockpitGauge[k] = c.optBoolean("g", false)
                          }
                      }
                  }

                  for (p in allParams()) sp.getString("al_" + p.k, null)?.split(",")?.let {
                      if (it.size == 3) alerts[p.k] = Al(it[0] == "1", it[1] == "1", it[2].toDoubleOrNull() ?: 0.0)
                  }
                  if (alerts["ect"] == null) alerts["ect"] = Al(true, true, 105.0)
                  if (alerts["iat"] == null) alerts["iat"] = Al(true, true, 55.0)
                  if (alerts["rail"] == null) alerts["rail"] = Al(false, false, 50.0)
              }

              private fun save() {
                  val e = sp.edit()
                  e.putBoolean("master", master).putInt("snd", snd).putString("uri", uri)
                      .putInt("cool", cool).putBoolean("vibe", vibe).putInt("shiftRpm", shiftRpm)
                      .putInt("dark_theme_opt", darkThemeOpt).putInt("accent_color_idx", accentColorIdx)
                      .putInt("sl_start", slStart).putInt("sl_mid", slMid).putInt("sl_max", slMax).putBoolean("sl_flash", slFlash)
                  alerts.forEach { (k, a) -> e.putString("al_$k", "${if (a.on) 1 else 0},${if (a.above) 1 else 0},${a.v}") }

                  val arrCust = JSONArray()
                  customSpecs.forEach { s ->
                      val o = JSONObject()
                      o.put("key", s.key).put("name", s.name).put("unit", s.unit).put("cmd", s.cmd)
                          .put("mode", s.mode).put("mul", s.mul).put("add", s.add).put("dec", s.dec)
                          .put("lo", s.lo).put("hi", s.hi).put("fast", s.fast).put("feedBoost", s.feedBoost)
                      arrCust.put(o)
                  }
                  e.putString("custom_pids", arrCust.toString())

                  val arrKeys = JSONArray()
                  visibleCockpitKeys.forEach { arrKeys.put(it) }
                  e.putString("visible_cockpit_keys", arrKeys.toString())

                  val cfg = JSONObject()
                  visibleCockpitKeys.forEach { k ->
                      cfg.put(k, JSONObject().put("s", cockpitSize[k] ?: 0).put("g", gaugeStyle(k)))
                  }
                  e.putString("cockpit_cfg", cfg.toString())
                  e.apply()
              }

              @Suppress("DEPRECATION")
              private fun beep() {
                  if (snd == 4 && uri != null) {
                      runCatching {
                          val r = RingtoneManager.getRingtone(this, Uri.parse(uri))
                          if (Build.VERSION.SDK_INT >= 28) r.audioAttributes = AudioAttributes.Builder().setUsage(AudioAttributes.USAGE_ALARM).build()
                          r.play()
                      }
                  } else {
                      val t = when (snd) {
                          0 -> ToneGenerator.TONE_PROP_BEEP
                          1 -> ToneGenerator.TONE_PROP_BEEP2
                          2 -> ToneGenerator.TONE_CDMA_ALERT_CALL_GUARD
                          else -> ToneGenerator.TONE_CDMA_EMERGENCY_RINGBACK
                      }
                      tg.startTone(t, if (snd == 3) 2000 else 700)
                  }
                  if (vibe) runCatching { (getSystemService(VIBRATOR_SERVICE) as Vibrator).vibrate(450) }
              }

